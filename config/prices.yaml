# Cloud list prices used to turn laptop measurements into dollars (on-demand, USD).
#   $/1M req (allocated) = (vCPU_allocated * usd_per_vcpu_hour + GB_peak * usd_per_gb_hour) / (rps * 3600) * 1e6
#   $/1M req (consumed)  = same, with the measured mean busy cores instead of allocated vCPUs
# The report prints these rates and `verified` next to every dollar figure. `verified: false` means
# the numbers were typed from memory of the public price lists, NOT checked against the pages in
# `source`: confirm (or replace) them and set verified: true / as_of before publishing.
default: gke_n2
reference:
  gke_n2:      # GCP n2-standard, us-central1, vCPU and memory billed separately
    usd_per_vcpu_hour: 0.031
    usd_per_gb_hour: 0.0042
    source: https://cloud.google.com/compute/vm-instance-pricing
    as_of: 2026-11-15
    verified: false
  eks_m6i:     # AWS m6i, us-east-1; price per vCPU = m6i.2xlarge $0.384/h / 8, memory included
    usd_per_vcpu_hour: 0.048
    usd_per_gb_hour: 0.0
    source: https://aws.amazon.com/ec2/pricing/on-demand/
    as_of: 2026-11-15
    verified: false
