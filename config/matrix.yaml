# Benchmark matrix. `bench/load/sweep.py` + `bench/load/scenarios.py` read it; `deploy/k8s/render.py`
# reads `pod_sizing` to emit requests==limits. Edit here, nowhere else.

slos_ms: [20, 50, 100]          # p99 thresholds that define capacity (MST rule, see BENCHMARK_DESIGN.md)
warmup_s: 30                    # long (confirm / overload / closed-loop) steps
measure_s: 60
reps: 3
error_budget: 0                 # any non-2xx fails the step

ladder:                         # short search steps that FIND capacity (x factor until the loosest SLO fails)
  start_rps: 10
  factor: 1.25
  max_rps: 20000
  bisect_steps: 3
search: {warmup_s: 5, measure_s: 15}
overload_factors: [1.5, 3.0]    # multiples of capacity@100ms for the overload steps
closed_loop_vus_per_replica: 4  # MODE=vus step for the max-throughput number

# Common offered-rate grid: every stack is measured at the same rates so latency-vs-RPS curves
# line up. A stack stops after `stop_after_fail` consecutive points that miss the loosest SLO.
grid:
  rps: [25, 50, 75, 100, 150, 200, 250, 300, 400, 500, 650]
  warmup_s: 10
  measure_s: 30
  stop_after_fail: 2

batching:
  ray:    {max_batch_size: 64, batch_wait_timeout_s: 0.005}
  triton: {preferred_batch_size: [8, 32, 64], max_queue_delay_us: 5000, max_batch_size: 1024}

# reserve_cores: cores left for the framework's own processes (Ray proxy, raylet, controller);
# ORT intra-op threads = cores/replicas - reserve_cores.
stack_props:
  fastapi_ort:       {supports_batching: false}
  ray_ort:           {supports_batching: true, reserve_cores: 2}   # Ray Serve, raw request handler
  ray_fastapi:       {supports_batching: true, reserve_cores: 2}   # Ray Serve + FastAPI ingress
  ray_triton_grpc:   {supports_batching: true, reserve_cores: 2}   # Triton-side dynamic batching
  ray_triton_inproc: {supports_batching: true, reserve_cores: 2}
  ray_family:        {supports_batching: false, reserve_cores: 2}  # multiplexing / fan-out / pipeline
  triton:            {supports_batching: true}

envs:
  # 6 serving cores + 2 for k6; Ray's native HAProxy front end (best laptop result), cores tuned.
  laptop: {serving_cpuset: "0-5", loadgen_cpuset: "6-7", total_cpus: 6, tuned: true,
           extra_env: {RAY_SERVE_ENABLE_HA_PROXY: "1"}}
  k8s-cpu: {total_cpus: 4}      # per experiment, split across pods per pod_sizing
  k8s-gpu: {total_cpus: 4, gpu: 1}

# Scenario parameters (bench/load/scenarios.py). Total laptop budget ~9 h.
scenarios:
  S1:                           # latency vs RPS, capacity, overload, closed loop (all stacks)
    stacks: [fastapi_ort, triton, ray_ort, ray_fastapi, ray_triton_grpc, ray_triton_inproc]
    reps: 3
    rows1_rps: [25, 100, 300]   # rows=1 latency points, one rep
  S1_scale:                     # fleet scaling on one box: replicas split the same 6 cores
    stacks: [ray_ort, fastapi_ort, triton]
    replicas: [1, 2, 4]
  S1_batch:                     # stack -> {variant: [batching, wait_ms]}
    rows: [1, 200]
    stacks:
      ray_ort: {nobatch: [0, 5], wait2: [1, 2], wait5: [1, 5]}
      triton: {nobatch: [0, 5], dynamic: [1, 5]}
  I1:                           # ingress: python proxy vs HAProxy vs gRPC
    grid_rps: [50, 200]
    variants:
      ray_python_proxy: {stack: ray_ort, env: {RAY_SERVE_ENABLE_HA_PROXY: 0}}
      ray_haproxy:      {stack: ray_ort, env: {RAY_SERVE_ENABLE_HA_PROXY: 1}}
      ray_grpc:         {stack: ray_ort, env: {RAY_SERVE_ENABLE_HA_PROXY: 0, GRPC: 1}, grpc: true}
      triton_http:      {stack: triton}
      triton_grpc:      {stack: triton, grpc: true}
  F1:                           # family under Zipf traffic
    zipf_s: 1.1
    mux_per_replica: [4, 16]
    scale_variants: [4, 64]
    start_rps: 25
    fixed_rps: 60
  F2:
    trials: 5
  F3:                           # fan-out to K variants at a fixed rate
    ks: [1, 4, 8]
    rate: 40
    zipf_s: 1.1
    reps: 2
  F5:                           # feature -> routed model -> postprocess
    zipf_s: 1.1
    grid_rps: [25, 75, 150]
    start_rps: 25
  A1:                           # 10x burst; fresh stack per rep
    base_rps: 30
    peak_rps: 300
    pre_s: 40
    burst_s: 90
    post_s: 40
    reps: 3
    variants:
      static1:       {replicas: 1, env: {}}
      static4:       {replicas: 4, env: {}}
      auto_t2_up0:   {env: {AUTOSCALE_MAX: 4, AUTOSCALE_MIN: 1, AUTOSCALE_TARGET: 2, AUTOSCALE_UPSCALE_DELAY_S: 0}}
      auto_t8_up0:   {env: {AUTOSCALE_MAX: 4, AUTOSCALE_MIN: 1, AUTOSCALE_TARGET: 8, AUTOSCALE_UPSCALE_DELAY_S: 0}}
      auto_t2_up10:  {env: {AUTOSCALE_MAX: 4, AUTOSCALE_MIN: 1, AUTOSCALE_TARGET: 2, AUTOSCALE_UPSCALE_DELAY_S: 10}}
  R1:                           # backpressure beyond capacity
    start_rps: 100
    factors: [1.5, 3.0]
    variants:
      ray_unbounded:  {stack: ray_ort}
      ray_queue50:    {stack: ray_ort, env: {MAX_QUEUED: 50}}
      fastapi_unbounded: {stack: fastapi_ort}
      fastapi_limit50:   {stack: fastapi_ort, env: {UVICORN_LIMIT_CONCURRENCY: 50}}
      triton_unbounded:  {stack: triton, batching: true}
      triton_queue50:    {stack: triton, batching: true, env: {QUEUE_SIZE: 50}}
  R2:                           # kill one serving process/pod under steady load
    rate: 100
    measure_s: 100
    reps: 3
    variants:
      ray:     {stack: ray_ort, replicas: 2, kill: "ray::ServeReplica"}
      fastapi: {stack: fastapi_ort, replicas: 2, kill: "spawn_main"}
      triton:  {stack: triton, replicas: 1, kill: container}

profiles:
  full:                         # `just overnight`: ~9 h, resume-safe
    scenarios: [S1, S1_scale, S1_batch, I1, F1, F2, F3, F5, A1, R1, R2]
  smoke:                        # `just smoke`: every config of every test, short steps, ~1 h
    quick: true
    scenarios: [S1, S1_scale, S1_batch, I1, F1, F2, F3, F5, A1, R1, R2]

# Kubernetes pod sizing: requests == limits (Guaranteed QoS). cpu is swept; total serving cpu
# per experiment stays constant (4 vCPU = 1x4, 2x2, or 4x1 pods).
pod_sizing:
  cpu_options: [1, 2, 4]
  memory:                        # small / large model
    fastapi_ort:       {small: 1Gi,   large: 3Gi}
    ray_head:          {small: 2Gi,   large: 2Gi,   cpu: 1}
    ray_worker:        {small: 2Gi,   large: 4Gi}
    ray_worker_inproc: {small: 4Gi,   large: 6Gi}
    triton:            {small: 1.5Gi, large: 3.5Gi}
    k6:                {small: 1Gi,   large: 1Gi,   cpu: 2}
