# kind v0.33.0 cluster: 1 control-plane + 2 workers (serving, loadgen).
# Node image tag v1.34.0 was chosen from memory: verify it (and its sha256 digest) against
# the kind v0.33.0 release notes before use.
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: raybench
nodes:
  - role: control-plane
    image: kindest/node:v1.34.0
  - role: worker
    image: kindest/node:v1.34.0
    labels:
      raybench/role: serving
  - role: worker
    image: kindest/node:v1.34.0
    labels:
      raybench/role: loadgen
