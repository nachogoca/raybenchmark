[project]
name = "raybenchmark"
version = "0.1.0"
description = "Model-serving benchmark: FastAPI vs Ray Serve vs Triton on DeepFM / DCNv2 (ONNX)"
requires-python = "==3.12.*"
# Runtime deps only: what a serving container needs.
dependencies = [
    "numpy",
    "pyyaml",
    "onnxruntime",
    "fastapi",
    "uvicorn[standard]",
    "ray[serve]",
    "tritonclient[grpc,http]",
    "httpx",
    "psutil",
    "orjson",
]

[dependency-groups]
export = ["torch", "onnx", "onnxscript"]        # model generation only
analysis = [
    "pandas",
    "matplotlib",
    "pyarrow",
    "plotly>=7.1.0",
]  # report only
dev = ["pytest", "ruff"]

[tool.uv]
package = true
default-groups = ["dev", "export", "analysis"]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cpu" }]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["bench"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: starts Ray"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "RUF100"]
ignore = ["E501"]
